<!DOCTYPE html>
<html>
<head>
    <title>Diamond Converter 💎</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: #111827;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-box {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
            background: #1f2937;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #16a34a;
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>💎 Diamond Converter</h1>

    <form method="POST" enctype="multipart/form-data">

        <div class="upload-box">
            <label>📁 Master File</label>
            <input type="file" name="master" required>
        </div>

        <div class="upload-box">
            <label>📁 Party File</label>
            <input type="file" name="party" required>
        </div>

        <label>Party Name</label>
        <input type="text" name="party_name" placeholder="e.g. BRILLIANT DIAM">

        <label>Section</label>
        <input type="text" name="section" placeholder="e.g. GAURANG">

        <label>India Price Person</label>
        <input type="text" name="india_price">

        <label>USA Price Person</label>
        <input type="text" name="usa_price">

        <label>Final File Person</label>
        <input type="text" name="final_file">

        <button type="submit">🚀 Convert File</button>

    </form>

    <div class="footer">
        Diamond File Converter • Flask Version
    </div>

</div>

</body>
</html>
